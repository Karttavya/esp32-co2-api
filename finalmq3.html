<!DOCTYPE html>
<html>
<head>
<title>ESP32 Gas Monitor</title>

<style>
body {
  font-family: 'Segoe UI', Arial;
  text-align: center;
  background: #141e30;
  background: linear-gradient(to bottom, #141e30, #243b55);
  color: white;
  margin: 0;
  padding: 0;
}

h2 {
  margin-top: 20px;
  font-size: 26px;
  font-weight: 600;
}

.gauge-container {
  width: 260px;
  margin: 30px auto;
}

svg {
  width: 260px;
  height: 160px;
}

.value-text {
  font-size: 28px;
  font-weight: bold;
  margin-top: -12px;
}

.status {
  font-size: 22px;
  font-weight: bold;
  margin-top: 10px;
}

.safe { color: #3cff70; }
.danger { color: #ff4444; }
</style>

<script>
function fetchData() {
  fetch("/api")
  .then(res => res.json())
  .then(data => {

    const gasValue = data.gasValue;
    const percent = gasValue / 4095;
    const angle = percent * 180;

    // Rotate needle
    document.getElementById("needle").setAttribute(
      "transform",
      "rotate(" + angle + " 130 130)"
    );

    // Meter fill
    document.getElementById("meter-fill").style.strokeDasharray =
      (percent * 565) + " 565";

    // Gas value text
    document.getElementById("gasValue").innerHTML = gasValue;

    // Status
    let st = document.getElementById("status");
    if (data.gasDetected) {
      st.innerHTML = "DANGER ⚠";
      st.className = "status danger";
    } else {
      st.innerHTML = "SAFE ✓";
      st.className = "status safe";
    }
  });
}

setInterval(fetchData, 800);
</script>

</head>
<body>

<h2>ESP32 Gas Detection Dashboard</h2>

<div class="gauge-container">
  <svg viewBox="0 0 260 150">

    <!-- Background Arc -->
    <path d="M30 130 A100 100 0 0 1 230 130"
          stroke="#555"
          stroke-width="18"
          fill="none" />

    <!-- Meter Fill -->
    <path id="meter-fill"
          d="M30 130 A100 100 0 0 1 230 130"
          stroke="#00ffcc"
          stroke-width="18"
          fill="none"
          stroke-dasharray="0 565"
          stroke-linecap="round"
          style="transition: stroke-dasharray 0.5s ease;" />

    <!-- Needle -->
    <line id="needle"
          x1="130" y1="130"
          x2="130" y2="40"
          stroke="#ff0040"
          stroke-width="6"
          stroke-linecap="round"
          transform="rotate(0 130 130)"
          style="transition: transform 0.5s ease;" />

    <!-- Needle Center -->
    <circle cx="130" cy="130" r="8" fill="#fff" />
  </svg>
</div>

<div class="value-text">
  Gas Value: <span id="gasValue">0</span>
</div>

<h3 id="status" class="status safe">SAFE ✓</h3>

</body>
</html>
